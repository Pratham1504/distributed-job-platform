name: distributed-job-platform-full

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-job_platform}
      POSTGRES_USER: ${POSTGRES_USER:-job_platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    build: ./monitoring/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-job_platform}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
    volumes: [rabbitmq-data:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-job_platform}
      DATABASE_USER: ${POSTGRES_USER:-job_platform}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-job_platform}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
      REDIS_HOST: redis
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?set a 32+ character JWT_SIGNING_KEY in .env}
      ARTIFACTS_LOCAL_ROOT: /var/lib/job-platform/artifacts
      FILE_ASSETS_LOCAL_ROOT: /var/lib/job-platform/file-assets
      WORKER_PLACEHOLDER_HANDLER_MINIMUM_DURATION: ${WORKER_PLACEHOLDER_HANDLER_MINIMUM_DURATION:-PT1S}
      WORKER_PLACEHOLDER_HANDLER_MAXIMUM_DURATION: ${WORKER_PLACEHOLDER_HANDLER_MAXIMUM_DURATION:-PT2S}
    volumes:
      - artifact-data:/var/lib/job-platform/artifacts
      - file-asset-data:/var/lib/job-platform/file-assets
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 3s
      retries: 12

  web:
    build: ./frontend
    ports: ["${WEB_PORT:-8088}:80"]
    depends_on:
      api: { condition: service_healthy }

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [monitoring]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"]
    depends_on:
      api: { condition: service_healthy }

  grafana:
    image: grafana/grafana:12.1.0
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-local-grafana-change-me}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports: ["127.0.0.1:${GRAFANA_PORT:-3000}:3000"]
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus: { condition: service_started }

volumes:
  postgres-data:
  rabbitmq-data:
  redis-data:
  artifact-data:
  file-asset-data:
  prometheus-data:
  grafana-data:
