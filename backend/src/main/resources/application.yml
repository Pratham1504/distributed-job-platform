spring:
  application:
    name: job-platform-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/job_platform}
    username: ${DATABASE_USER:job_platform}
    password: ${DATABASE_PASSWORD:change-me-before-use}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:job_platform}
    password: ${RABBITMQ_PASSWORD:change-me-before-use}
    publisher-confirm-type: correlated
    publisher-returns: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8080}

app:
  security:
    jwt-secret: ${JWT_SIGNING_KEY:development-only-secret-change-me-32}
    access-token-ttl: PT15M
    refresh-token-ttl: P7D
  dispatch:
    poll-interval-ms: 1000
    enabled: ${DISPATCH_ENABLED:true}
  quota:
    submissions-per-minute: ${SUBMISSIONS_PER_MINUTE:60}
    max-queued-per-project: ${MAX_QUEUED_PER_PROJECT:1000}
  worker:
    concurrency: ${WORKER_CONCURRENCY:4}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
